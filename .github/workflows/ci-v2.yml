name: build-v2

on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"
      - "_example/**"
  pull_request:
    paths:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"
      - "_example/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # goveralls posts the coverage status to the commit

    steps:
      - name: disable and stop mono-xsp4.service (wtf?)
        run: |
          sudo systemctl stop mono-xsp4.service || true
          sudo systemctl disable mono-xsp4.service || true

      - name: checkout
        uses: actions/checkout@v7

      - name: read go version from v2/go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' v2/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
          cache-dependency-path: v2/go.sum
        id: go

      - name: launch mongodb
        uses: wbari/start-mongoDB@v0.2
        with:
          mongoDBVersion: "6.0"

      - name: build the example
        working-directory: _example
        run: |
          go build -race
        env:
          TZ: "America/Chicago"

      - name: build and test
        run: |
          go test -timeout=60s -v -race -p 1 -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/profile.cov" ./...
          go build -race
        working-directory: v2
        env:
          TZ: "America/Chicago"
          ENABLE_MONGO_TESTS: "true"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --config=../.golangci.yml
          working-directory: v2

      - name: submit coverage
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile="$GITHUB_WORKSPACE/profile.cov"
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
