name: build

on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths-ignore:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"
      - "_example/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"
      - "_example/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # goveralls posts the coverage status to the commit

    steps:
      - name: disable and stop mono-xsp4.service (wtf?)
        run: |
          sudo systemctl stop mono-xsp4.service || true
          sudo systemctl disable mono-xsp4.service || true

      - name: checkout
        uses: actions/checkout@v7

      - name: read go version from go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
        id: go

      - name: launch mongodb
        uses: wbari/start-mongoDB@v0.2
        with:
          mongoDBVersion: "6.0"

      - name: build and test
        run: |
          go test -timeout=60s -v -race -p 1 -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/profile.cov" ./...
          go build -race
        env:
          TZ: "America/Chicago"
          ENABLE_MONGO_TESTS: "true"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: submit coverage
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile="$GITHUB_WORKSPACE/profile.cov"
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
